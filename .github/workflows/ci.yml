name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and check (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-14
            arch: x86_64
            target: x86_64-apple-darwin
          - os: windows-2022
            arch: x86_64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }} --verbose

      - name: Check formatting
        if: matrix.os == 'ubuntu-22.04' && matrix.arch == 'x86_64'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.os == 'ubuntu-22.04' && matrix.arch == 'x86_64'
        run: cargo clippy --all-targets -- -D warnings || cargo clippy --all-targets

  # Quick smoke test: build and run --help in headless mode.
  smoke-test:
    name: Smoke test (--help)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Run --help
        run: ./target/release/synapse --help
      - name: Run --headless (2s timeout)
        run: timeout 2 ./target/release/synapse --headless || true
