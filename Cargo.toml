[package]
name = "synapse"
version = "0.2.3"
edition = "2021"
authors = ["Kodjaoglanian"]
description = "Decentralized P2P tunneling platform with a high-end terminal UI"
license = "MIT"
repository = "https://github.com/Kodjaoglanian/synapse"
homepage = "https://github.com/Kodjaoglanian/synapse"
keywords = ["webrtc", "p2p", "tunnel", "tui", "ratatui"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
webrtc = "0.11"
ratatui = { version = "0.26", features = ["all-widgets"] }
crossterm = { version = "0.27", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive", "env"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
